<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Create Account — NeuroWell</title>
  <meta name="description" content="Create your free NeuroWell wellness account.">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#8b5cf6">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">

<div class="auth-logo">
  <div class="auth-logo__icon">🧠</div>
  <div class="auth-logo__name"><span>Neuro</span>Well</div>
</div>

<div class="auth-card">

  <div class="auth-offline-badge" id="offlineBadge" style="display:none">
    📦 Offline Mode — data stored on this device
  </div>

  <div class="auth-title">Start your journey</div>
  <p class="auth-sub">Create a free account and get your personalized wellness plan in minutes.</p>

  <div class="auth-alert" id="formAlert"></div>

  <form class="auth-form" id="signupForm" onsubmit="return false">
    <!-- Name -->
    <div class="auth-field">
      <label class="auth-label" for="signupName">👤 Full Name</label>
      <div class="auth-input-wrap">
        <span class="auth-input-icon">✏️</span>
        <input class="auth-input" type="text" id="signupName" placeholder="Your name" autocomplete="name" required>
      </div>
      <div class="field-error" id="nameError">⚠️ <span></span></div>
    </div>

    <!-- Email -->
    <div class="auth-field">
      <label class="auth-label" for="signupEmail">✉️ Email Address</label>
      <div class="auth-input-wrap">
        <span class="auth-input-icon">@</span>
        <input class="auth-input" type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field-error" id="emailError">⚠️ <span></span></div>
    </div>

    <!-- Password -->
    <div class="auth-field">
      <label class="auth-label" for="signupPassword">🔒 Password</label>
      <div class="auth-input-wrap">
        <span class="auth-input-icon">🔑</span>
        <input class="auth-input" type="password" id="signupPassword" placeholder="Min. 8 characters" autocomplete="new-password" required oninput="checkStrength(this.value)">
        <button type="button" class="pw-toggle" onclick="togglePw('signupPassword',this)">👁️</button>
      </div>
      <div class="pw-strength"><div class="pw-strength-fill" id="strengthFill"></div></div>
      <div id="strengthLabel" style="font-size:.7rem;color:var(--a-t3);margin-top:.25rem"></div>
      <div class="field-error" id="pwError">⚠️ <span></span></div>
    </div>

    <!-- Confirm Password -->
    <div class="auth-field">
      <label class="auth-label" for="signupConfirm">✅ Confirm Password</label>
      <div class="auth-input-wrap">
        <span class="auth-input-icon">🔐</span>
        <input class="auth-input" type="password" id="signupConfirm" placeholder="Repeat password" autocomplete="new-password" required>
      </div>
      <div class="field-error" id="confirmError">⚠️ <span></span></div>
    </div>

    <!-- Terms -->
    <label style="display:flex;align-items:flex-start;gap:.6rem;font-size:.78rem;color:var(--a-t3);cursor:pointer;margin-top:-.25rem">
      <input type="checkbox" id="termsCheck" style="accent-color:#8b5cf6;margin-top:2px;flex-shrink:0">
      I agree to the <a href="#" style="color:#c4b5fd;text-decoration:none">Terms of Service</a> and <a href="#" style="color:#c4b5fd;text-decoration:none">Privacy Policy</a>
    </label>
    <div class="field-error" id="termsError">⚠️ <span></span></div>

    <button type="submit" class="auth-btn" id="signupBtn" onclick="submitSignup()">
      <div class="spinner"></div>
      <span class="btn-text">🚀 Create Free Account</span>
    </button>
  </form>

  <div class="auth-link">
    Already have an account? <a href="login.html">Sign in →</a>
  </div>

  <!-- Benefits -->
  <div style="margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--a-border)">
    <div style="font-size:.72rem;color:var(--a-t3);text-align:center;margin-bottom:.75rem">What you get for free:</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">
      <div style="font-size:.72rem;color:var(--a-t2);display:flex;align-items:center;gap:.35rem">🧠 AI Predictions</div>
      <div style="font-size:.72rem;color:var(--a-t2);display:flex;align-items:center;gap:.35rem">🎯 Adaptive Goals</div>
      <div style="font-size:.72rem;color:var(--a-t2);display:flex;align-items:center;gap:.35rem">🎮 Gamification</div>
      <div style="font-size:.72rem;color:var(--a-t2);display:flex;align-items:center;gap:.35rem">💬 AI Coach</div>
    </div>
  </div>
</div>

<script>
window.CONSTANTS = window.CONSTANTS || {STORAGE:{},SCORE_RANGES:{},BURNOUT_RISK:{},ASSESSMENT:{TOTAL_QUESTIONS:30}};
window.QUESTIONS  = window.QUESTIONS  || [];
</script>
<script src="../js/utils.js"></script>
<script src="../data/constants.js"></script>
<script src="../data/questions.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/firebaseService.js"></script>

<script>
window.addEventListener('DOMContentLoaded', async () => {
  await FirebaseService.init();
  const user = FirebaseService.getCurrentUser();
  if (user) { window.location.href = '../dashboard.html'; return; }
  if (!FirebaseService.isConfigured) {
    document.getElementById('offlineBadge').style.display = 'inline-flex';
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});
});

// ── Password strength ─────────────────────────────────────────────
function checkStrength(pw) {
  const fill  = document.getElementById('strengthFill');
  const label = document.getElementById('strengthLabel');
  let score   = 0;
  if (pw.length >= 8)  score++;
  if (pw.length >= 12) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  const levels = [
    { pct:'20%', color:'#ef4444', label:'Very Weak' },
    { pct:'40%', color:'#f97316', label:'Weak'      },
    { pct:'60%', color:'#f59e0b', label:'Fair'      },
    { pct:'80%', color:'#3b82f6', label:'Good'      },
    { pct:'100%',color:'#10b981', label:'Strong'    },
  ];
  const lvl   = levels[Math.min(score, 4)];
  fill.style.width      = pw ? lvl.pct : '0';
  fill.style.background = lvl.color;
  label.textContent     = pw ? lvl.label : '';
  label.style.color     = lvl.color;
}

// ── Signup ────────────────────────────────────────────────────────
async function submitSignup() {
  const name    = document.getElementById('signupName').value.trim();
  const email   = document.getElementById('signupEmail').value.trim();
  const pw      = document.getElementById('signupPassword').value;
  const confirm = document.getElementById('signupConfirm').value;
  const terms   = document.getElementById('termsCheck').checked;
  const btn     = document.getElementById('signupBtn');

  clearErrors();

  // Validation
  if (!name || name.length < 2) { showFieldError('nameError','Please enter your name (min. 2 chars).'); return; }
  if (!email || !isEmail(email)){ showFieldError('emailError','Please enter a valid email address.'); return; }
  if (!pw || pw.length < 8)     { showFieldError('pwError','Password must be at least 8 characters.'); return; }
  if (pw !== confirm)            { showFieldError('confirmError','Passwords do not match.'); return; }
  if (!terms)                    { showFieldError('termsError','Please accept the terms to continue.'); return; }

  btn.classList.add('loading'); btn.disabled = true;

  const { user, error } = await FirebaseService.registerUser(email, pw, name);

  btn.classList.remove('loading'); btn.disabled = false;

  if (error) { showAlert(error, 'error'); return; }

  showAlert('🎉 Account created! Setting up your dashboard…', 'success');

  // Seed initial data for new user
  try {
    if (typeof EngagementGamification !== 'undefined') EngagementGamification.recordAction('first_login');
  } catch {}

  setTimeout(() => { window.location.href = '../assessment.html'; }, 1200);
}

// ── Helpers ───────────────────────────────────────────────────────
function isEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  inp.type  = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁️' : '🙈';
}
function showAlert(msg, type) {
  const el = document.getElementById('formAlert');
  el.textContent = msg; el.className = `auth-alert ${type} show`;
}
function showFieldError(id, msg) {
  const el = document.getElementById(id);
  el.querySelector('span').textContent = msg;
  el.classList.add('show');
}
function clearErrors() {
  document.getElementById('formAlert').className = 'auth-alert';
  document.querySelectorAll('.field-error').forEach(e => e.classList.remove('show'));
}
</script>
</body>
</html>
