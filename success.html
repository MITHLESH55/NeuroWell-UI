<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - NeuroWell</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
        }
        h1 { margin-bottom: 1rem; color: #10b981; }
        p { color: #94a3b8; margin-bottom: 2rem; }
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #10b981;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Payment Successful!</h1>
        <p>Unlocking your Pro features and redirecting to dashboard...</p>
        <div class="loader"></div>
    </div>

    <script>
        // Store Pro status locally
        localStorage.setItem("isPro", "true");
        
        // Short delay for visual feedback, then redirect
        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 2000);
    </script>
</body>
</html>
